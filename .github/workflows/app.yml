name: Android app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gawk make patch curl

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "cmake;3.22.1" \
            "ndk;26.1.10909125"

      - name: Build the patched proot
        run: |
          NDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/26.1.10909125" \
            bash tools/build-proot.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build the APK
        run: gradle --no-daemon --console=plain :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: rpos-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
