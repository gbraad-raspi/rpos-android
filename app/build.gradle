plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gbraad.rpos'
    compileSdk 33
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId 'com.gbraad.rpos'
        minSdk 29
        targetSdk 33
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // No third-party runtime dependencies: the installer uses java.util.zip and
    // Android's own tar, so the build works from the container's offline cache.
}
